name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - name: Package app
        run: |
          codesign --force --deep --sign - build/Scalpellino.app
          ditto -c -k --keepParent build/Scalpellino.app Scalpellino-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Scalpellino-${{ matrix.arch }}
          path: Scalpellino-${{ matrix.arch }}.zip
          retention-days: 30


  linux:
    # Core tests + scripted UI tests on a virtual screen (Xvfb + Mesa software GL).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11/GL packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev xvfb
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: UI tests (scripted)
        run: tests/ui/run.sh "$PWD/build/Scalpellino" ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/*.png
          if-no-files-found: ignore
          retention-days: 30
