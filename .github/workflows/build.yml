name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - name: Package app
        run: |
          codesign --force --deep --sign - build/Scalpellino.app
          ditto -c -k --keepParent build/Scalpellino.app Scalpellino-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Scalpellino-${{ matrix.arch }}
          path: Scalpellino-${{ matrix.arch }}.zip
          retention-days: 30


  linux:
    # Core tests + scripted UI tests on a virtual screen (Xvfb + Mesa software GL).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11/GL packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev xvfb
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: UI tests (scripted)
        run: tests/ui/run.sh "$PWD/build/Scalpellino" ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/*.png
          if-no-files-found: ignore
          retention-days: 30

  # Publishes the Mac builds on the repo's Releases page:
  #  - every push to main updates the "latest" pre-release (newest working build)
  #  - pushing a version tag (v0.1.0, ...) creates a permanent release, with notes from
  #    docs/releases/<tag>.md
  release:
    needs: [macos, linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Scalpellino-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            notes="docs/releases/${GITHUB_REF_NAME}.md"
            [ -f "$notes" ] || notes="docs/releases/INSTALL.md"
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "Scalpellino ${GITHUB_REF_NAME}" --notes-file "$notes" --verify-tag
          else
            subject="$(git log -1 --format=%s)"
            { echo "Newest working build from \`main\` (${GITHUB_SHA::7}): ${subject}"; echo; cat docs/releases/INSTALL.md; } > latest-notes.md
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest dist/*.zip --prerelease --target "${GITHUB_SHA}" \
              --title "Latest build" --notes-file latest-notes.md
          fi
